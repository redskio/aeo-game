<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AEO 경쟁 테스트</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Noto Sans KR', sans-serif; background: #0f172a; color: #f1f5f9; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .wrap { width: 100%; max-width: 420px; text-align: center; }
  h1 { font-size: 26px; font-weight: 800; margin-bottom: 8px; }
  h1 span { color: #7dd3fc; }
  p { color: #94a3b8; font-size: 14px; margin-bottom: 32px; }
  .cohorts { display: grid; gap: 12px; }
  a { display: block; background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 22px; color: #f1f5f9; text-decoration: none; font-size: 20px; font-weight: 700; transition: border-color .2s, background .2s; }
  a:hover { border-color: #7dd3fc; background: #243247; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>AEO <span>경쟁 테스트</span></h1>
    <p>참여하는 기수를 선택하세요</p>
    <div class="cohorts">
      <a href="/agm3" id="cohort-agm3">AGM 3기</a>
      <a href="/agm4" id="cohort-agm4">AGM 4기</a>
    </div>
  </div>
</body>
</html>
